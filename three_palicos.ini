; 前两只照常在游戏里选择，第三只必须处于待机状态。
; v0.4.0 本地测试：可自定义第三只选猫组合键。
; 第三只使用独立的出生和普通跟随站位；地形挤压仍遵循原版规则。
; 在随从看板->选择随从->猫列表，按 SelectCombo 设置/取消；重新打开列表后读取修改。
; 编号是逻辑编号，不是排序后的格子号；日志 [threecats] roster 列出编号和名字。
; -1 关闭；修改后下一次出发生效。游戏内保存的存档目录配置优先于本文件。
; 默认启用逻辑第 4 只（编号 3）；需已雇佣、待机，不与前两只或当前主控猎喵重复。
[ThreePalicos]
ThirdPalicoIndex = 3
; 至少两个不同按键，以+连接：L R ZL ZR LSTICK(左摇杆按下) RSTICK(右摇杆按下)。
; 名称不区分大小写，允许空格。例如 L+R。缺少或无效时使用 ZL+RSTICK。
; 已有游戏内选猫记录时，请编辑存档目录 three_palicos.ini；选猫保存会保留本设置。
SelectCombo = ZL+RSTICK
